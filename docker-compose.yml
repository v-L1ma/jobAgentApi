services:

  api:
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    ports:
      - "5000:80"
    mem_limit: 512m
    mem_reservation: 420m
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_GCHeapHardLimitPercent=70
      - DOTNET_GCServer=0
      - DOTNET_GCConcurrent=1
      - DOTNET_TieredPGO=1
      - DOTNET_TC_QuickJitForLoops=1
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=jobAgent;Username=postgres;Password=admin;
    extra_hosts:
      - "host.docker.internal:host-gateway"
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
